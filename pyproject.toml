[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "stock-ai-decision-support"
version = "0.1.0"
description = "Point-in-time Japanese-equity research and portfolio decision-support MVP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<24",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "typer>=0.12,<1",
]

[project.scripts]
stock-ai = "stock_ai.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stock_ai"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["stock_ai"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["stock_ai"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
